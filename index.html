<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Eeshal ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#ffd6e8,#ffeef5,#fff8fb);
    overflow:hidden;
}

/* Hero */

.hero{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    position:relative;
}

/* Glass Card */

.card{
    width:90%;
    max-width:650px;
    background:rgba(255,255,255,.25);
    backdrop-filter:blur(15px);
    border-radius:25px;
    padding:40px;
    box-shadow:0 0 40px rgba(255,105,180,.25);
}

h1{
    font-size:55px;
    color:#d81b60;
    animation:glow 2s infinite alternate;
}

@keyframes glow{
from{
text-shadow:0 0 10px white;
}
to{
text-shadow:0 0 25px gold;
}
}

#typing{
    font-size:22px;
    color:#7b3058;
    margin-top:20px;
    min-height:60px;
}

/* Hearts */

.heart{
position:fixed;
bottom:-40px;
font-size:28px;
animation:float 8s linear infinite;
}

@keyframes float{

from{
transform:translateY(0);
opacity:0;
}

20%{
opacity:1;
}

to{
transform:translateY(-120vh);
opacity:0;
}

}

/* Balloons */

.balloon{
position:absolute;
font-size:50px;
animation:up 12s linear infinite;
opacity:.8;
}

@keyframes up{

from{
transform:translateY(120vh);
}

to{
transform:translateY(-150vh);
}

}

/* Stars */

.star{
position:absolute;
width:3px;
height:3px;
background:white;
border-radius:50%;
animation:blink 1.5s infinite;
}

@keyframes blink{
50%{
opacity:.2;
}
100%{
opacity:1;
}
}

button{
margin-top:30px;
padding:15px 35px;
border:none;
border-radius:40px;
background:#ff4081;
color:white;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}
</style>

</head>

<body>

<div class="hero">

<div class="card">

<h1>🎂 Happy Birthday Eeshal ❤️</h1>

<p id="typing"></p>

<button onclick="alert('Welcome to your birthday surprise! ❤️')">
Enter Surprise
</button>

</div>

</div>

<script>

/* Typewriter */

const text="Wishing you endless happiness, smiles, love and unforgettable memories. Today is all about you. Happy Birthday! ❤️";

let i=0;

function type(){

if(i<text.length){

document.getElementById("typing").innerHTML+=text.charAt(i);

i++;

setTimeout(type,45);

}

}

type();

/* Hearts */

setInterval(()=>{

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.animationDuration=(5+Math.random()*5)+"s";

document.body.appendChild(heart);

setTimeout(()=>heart.remove(),9000);

},300);

/* Balloons */

for(let i=0;i<10;i++){

let b=document.createElement("div");

b.className="balloon";

b.innerHTML="🎈";

b.style.left=Math.random()*100+"vw";

b.style.animationDuration=(8+Math.random()*8)+"s";

document.body.appendChild(b);

}

/* Stars */

for(let i=0;i<120;i++){

let s=document.createElement("div");

s.className="star";

s.style.left=Math.random()*100+"vw";

s.style.top=Math.random()*100+"vh";

s.style.animationDelay=Math.random()*2+"s";

document.body.appendChild(s);

}


/* =========================
   PART 2 — BIRTHDAY SYSTEM
   ========================= */

/*
   CHANGE THIS DATE TO EESHAL'S
   ACTUAL BIRTHDAY.

   Example:
   August 15, 2026
*/
const birthdayDate = new Date("2026-08-15T00:00:00");


/* =========================
   COUNTDOWN
   ========================= */

function updateCountdown(){

    const now = new Date();
    const difference = birthdayDate - now;

    if(difference <= 0){

        document.getElementById("days").textContent = "00";
        document.getElementById("hours").textContent = "00";
        document.getElementById("minutes").textContent = "00";
        document.getElementById("seconds").textContent = "00";

        document.getElementById("countdownTitle").textContent =
            "🎉 HAPPY BIRTHDAY EESHAL! 🎉";

        return;
    }

    const days = Math.floor(
        difference / (1000 * 60 * 60 * 24)
    );

    const hours = Math.floor(
        (difference / (1000 * 60 * 60)) % 24
    );

    const minutes = Math.floor(
        (difference / (1000 * 60)) % 60
    );

    const seconds = Math.floor(
        (difference / 1000) % 60
    );

    document.getElementById("days").textContent =
        String(days).padStart(2,"0");

    document.getElementById("hours").textContent =
        String(hours).padStart(2,"0");

    document.getElementById("minutes").textContent =
        String(minutes).padStart(2,"0");

    document.getElementById("seconds").textContent =
        String(seconds).padStart(2,"0");
}

setInterval(updateCountdown,1000);
updateCountdown();


/* =========================
   BLOW CANDLES
   ========================= */

let candlesBlown = false;

function blowCandles(){

    if(candlesBlown) return;

    candlesBlown = true;

    document.querySelectorAll(".flame").forEach(
        flame => flame.classList.add("off")
    );

    document.getElementById("blowButton").textContent =
        "✨ Candles Blown Out!";

    document.getElementById("birthdayMessage")
        .classList.add("show");

    createConfetti();

    launchFireworks();

    playBirthdaySong();
}


/* =========================
   CONFETTI
   ========================= */

function createConfetti(){

    for(let i=0;i<100;i++){

        const piece = document.createElement("div");

        piece.className="confetti";

        piece.style.left =
            Math.random()*100+"vw";

        piece.style.background =
            [
                "#ff4081",
                "#ffca28",
                "#ab47bc",
                "#42a5f5",
                "#66bb6a",
                "#ff7043"
            ][Math.floor(Math.random()*6)];

        piece.style.animationDuration =
            (2+Math.random()*3)+"s";

        piece.style.transform =
            `rotate(${Math.random()*360}deg)`;

        document.body.appendChild(piece);

        setTimeout(()=>{
            piece.remove();
        },5000);
    }
}


/* =========================
   FIREWORKS
   ========================= */

function launchFireworks(){

    for(let i=0;i<15;i++){

        setTimeout(()=>{

            const firework =
                document.createElement("div");

            firework.className="firework";

            firework.style.left =
                (15+Math.random()*70)+"vw";

            firework.style.top =
                (15+Math.random()*55)+"vh";

            document.body.appendChild(firework);

            setTimeout(()=>{
                firework.remove();
            },1100);

        },i*150);
    }
}


/* =========================
   BIRTHDAY MUSIC
   =========================

   This uses the browser's own
   audio system, so no MP3 is
   required.
*/

let audioContext = null;

function playBirthdaySong(){

    if(audioContext){
        audioContext.close();
    }

    audioContext =
        new (window.AudioContext ||
        window.webkitAudioContext)();

    const notes = [
        261.63,
        261.63,
        293.66,
        261.63,
        349.23,
        329.63,

        261.63,
        261.63,
        293.66,
        261.63,
        392.00,
        349.23
    ];

    let time =
        audioContext.currentTime;

    notes.forEach((frequency,index)=>{

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type="sine";

        oscillator.frequency.value =
            frequency;

        gain.gain.setValueAtTime(
            0.001,
            time
        );

        gain.gain.exponentialRampToValueAtTime(
            0.18,
            time+0.03
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            time+0.45
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start(time);
        oscillator.stop(time+0.5);

        time += 0.5;
    });
}


/* =========================
   MUSIC BUTTON
   ========================= */

function playMusic(){

    playBirthdaySong();

    document.getElementById("musicButton")
        .textContent="🎵 Birthday Music Playing!";
}

</script>

</body>
</html>
